services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: apexvoid_ledger
    ports:
      - "5432:5432"
    # Bind-mounted so local test data survives rebuilds and `docker compose down -v`
    # (named volumes are removed by `-v`; this directory is not).
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d apexvoid_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ledger:ledger@postgres:5432/apexvoid_ledger?schema=public
      PORT: "4000"
      SECRET_KEY: dev-only-change-me
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
